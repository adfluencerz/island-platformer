<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Platformer</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #0a0a12; }
      #app { width: 100vw; height: 100vh; display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; color: #fff;
        font: 14px/1.4 system-ui, sans-serif; background: rgba(0,0,0,0.35);
        padding: 8px 12px; border-radius: 8px; pointer-events: none;
      }
      #item-counter {
        position: fixed; top: 12px; right: 12px; color: #fff;
        font: 14px/1.4 system-ui, sans-serif; background: rgba(0,0,0,0.35);
        padding: 8px 12px; border-radius: 8px; pointer-events: none;
        display: flex; gap: 14px;
      }
      #item-counter .stat { display: flex; align-items: center; gap: 6px; }
      #item-counter .swatch {
        width: 12px; height: 12px; border-radius: 50%; display: inline-block;
      }
      #inventory-panel {
        position: fixed; bottom: 12px; right: 12px; color: #fff;
        font: 14px/1.5 system-ui, sans-serif; background: rgba(0,0,0,0.55);
        padding: 10px 14px; border-radius: 8px; min-width: 160px;
        display: none;
      }
      #inventory-panel.open { display: block; }
      #inventory-panel h3 { margin: 0 0 6px; font-size: 13px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; }
      #inventory-panel ul { list-style: none; margin: 0; padding: 0; }
      #inventory-panel li { display: flex; justify-content: space-between; padding: 2px 0; }
      #inventory-hint {
        position: fixed; bottom: 12px; left: 12px; color: #fff; opacity: 0.7;
        font: 12px/1.4 system-ui, sans-serif; background: rgba(0,0,0,0.35);
        padding: 6px 10px; border-radius: 8px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">WASD / Arrow Keys to move &middot; Space to jump &middot; E to till soil (Hoe) &middot; I for inventory</div>
    <div id="item-counter"></div>
    <div id="inventory-panel">
      <h3>Inventory</h3>
      <ul id="inventory-list"></ul>
    </div>
    <div id="inventory-hint">Press I to toggle inventory</div>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
